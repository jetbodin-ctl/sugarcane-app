<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaneSmart AI - ระบบบริหารจัดการแปลงอ้อยอัจฉริยะ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .bg-cane {
      background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop');
      background-size: cover; background-position: center;
    }
    #map { height: 280px; width: 100%; border-radius: 1rem; z-index: 1; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between">

  <!-- ==================== SECTION 1: LOGIN / REGISTER PAGE ==================== -->
  <div id="page-auth" class="bg-cane min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md rounded-3xl border border-slate-700 shadow-2xl p-6 sm:p-8 space-y-6 relative overflow-hidden">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-emerald-500/20 border-2 border-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg shadow-emerald-500/10">
          🌱
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide">CaneSmart AI</h1>
        <p class="text-xs text-slate-400">ระบบบริหารจัดการแปลงอ้อยอัจฉริยะ</p>
      </div>

      <!-- Tab Switcher -->
      <div class="bg-slate-800/80 p-1 rounded-xl flex text-xs font-semibold border border-slate-700">
        <button type="button" id="btn-login-tab" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white transition-all cursor-pointer">เข้าสู่ระบบ</button>
        <button type="button" id="btn-register-tab" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer">ลงทะเบียนชาวไร่</button>
      </div>

      <!-- FORM 1: LOGIN -->
      <form id="form-login" onsubmit="handleAuth(event, 'login')" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">เลขโควตา / เบอร์โทรศัพท์</label>
          <div class="relative">
            <i class="fa-solid fa-id-card absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="login-id" required placeholder
