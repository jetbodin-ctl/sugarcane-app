<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaneSmart AI - เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; }
    .bg-cane {
      background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="bg-cane min-h-screen flex items-center justify-center p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md rounded-3xl border border-slate-700 shadow-2xl p-6 sm:p-8 space-y-6 text-white relative overflow-hidden">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-emerald-500/20 border-2 border-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg shadow-emerald-500/10">
        🌱
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">CaneSmart AI</h1>
      <p class="text-xs text-slate-400">ระบบบริหารจัดการแปลงอ้อยอัจฉริยะ</p>
    </div>

    <!-- Tab Switcher (Login / Register) -->
    <div class="bg-slate-800/80 p-1 rounded-xl flex text-xs font-semibold border border-slate-700">
      <button id="btn-login-tab" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white transition-all duration-200">
        เข้าสู่ระบบ
      </button>
      <button id="btn-register-tab" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all duration-200">
        ลงทะเบียนชาวไร่
      </button>
    </div>

    <!-- FORM 1: LOGIN -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">เลขโควตา / เบอร์โทรศัพท์</label>
        <div class="relative">
          <i class="fa-solid fa-id-card absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="text" required placeholder="เช่น 950123 หรือ 0812345678" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
      </div>

      <div class="flex justify-between items-center text-xs">
        <label class="flex items-center space-x-2 text-slate-400 cursor-pointer">
          <input type="checkbox" class="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-0">
          <span>จำฉันไว้ในระบบ</span>
        </label>
        <a href="#" onclick="alert('กรุณาติดต่อเจ้าหน้าที่นักส่งเสริมประจำโรงงานเพื่อรีเซ็ตรหัสผ่าน')" class="text-emerald-400 hover:underline">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-emerald-900/40 transition-all active:scale-[0.98]">
        เข้าสู่ระบบ <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </form>

    <!-- FORM 2: REGISTER -->
    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">ประเภทผู้ใช้งาน</label>
        <select class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="farmer">🌾 ชาวไร่อ้อย / เกษตรกร</option>
          <option value="promoter">👨‍🌾 นักส่งเสริมประจำโรงงาน</option>
          <option value="admin">🏢 เจ้าหน้าที่โรงงาน / ผู้บริหาร</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อ - นามสกุล</label>
        <input type="text" required placeholder="นายสมศักดิ์ รักเกษตร" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">เลขโควตาชาวไร่</label>
          <input type="text" required placeholder="950123" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">เบอร์โทรศัพท์</label>
          <input type="tel" required placeholder="0812345678" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่านสำหรับเข้าใช้งาน</label>
        <input type="password" required placeholder="อย่างน้อย 6 หลัก" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2 px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition-all active:scale-[0.98] mt-2">
        ยืนยันการลงทะเบียน
      </button>
    </form>

    <!-- Footer Info -->
    <div class="text-center text-[11px] text-slate-500 pt-2 border-t border-slate-800">
      สนับสนุนเทคโนโลยีการเกษตรแม่นยำ (Smart Farming)
    </div>

  </div>

  <script>
    // สลับแท็บ Login / Register
    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const loginBtn = document.getElementById('btn-login-tab');
      const regBtn = document.getElementById('btn-register-tab');

      if(tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-white transition-all duration-200";
        regBtn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all duration-200";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-white transition-all duration-200";
        loginBtn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all duration-200";
      }
    }

    // จำลองการเข้าสู่ระบบ
    function handleLogin(e) {
      e.preventDefault();
      alert('เข้าสู่ระบบสำเร็จ! กำลังพาท่านไปยังหน้าจัดการแปลงอ้อย...');
      // ในขั้นตอนถัดไปจะย้ายไปหน้า Dashboard หลัก
    }

    // จำลองการลงทะเบียน
    function handleRegister(e) {
      e.preventDefault();
      alert('ลงทะเบียนสำเร็จ! กรุณาเข้าสู่ระบบด้วยเลขโควตาและรหัสผ่านของคุณ');
      switchTab('login');
    }
  </script>
</body>
</html>
